name: chart-analyzer

x-app-env: &app-env
  ENVIRONMENT: docker
  DATABASE_URL: postgresql+asyncpg://chart:chart@postgres:5432/chart_analyzer
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://chart:chart@rabbitmq:5672/
  UPLOAD_DIR: /data/uploads

x-app: &app
  build:
    context: .
    target: runtime
  env_file:
    - path: .env
      required: false
  environment: *app-env
  volumes:
    - uploads:/data/uploads

services:
  api:
    <<: *app
    command: uvicorn chart_analyzer.api.app:create_app --factory --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: python -m chart_analyzer.worker
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Applies schema and demo-data migrations, then exits.
  migrate:
    <<: *app
    command: alembic upgrade head
    depends_on:
      postgres: { condition: service_healthy }

  # One-off: `docker compose run --rm tests`
  tests:
    <<: *app
    build:
      context: .
      target: test
    profiles: ["test"]
    command: pytest
    environment:
      <<: *app-env
      TEST_DATABASE_URL: postgresql+asyncpg://chart:chart@postgres:5432/chart_analyzer_test
      TEST_REDIS_URL: redis://redis:6379/1
      TEST_RABBITMQ_URL: amqp://chart:chart@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chart
      POSTGRES_PASSWORD: chart
      POSTGRES_DB: chart_analyzer
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chart -d chart_analyzer"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: chart
      RABBITMQ_DEFAULT_PASS: chart
    ports:
      - "55672:5672"
      - "15673:15672" # management UI: http://localhost:15673 (chart / chart)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  uploads:
